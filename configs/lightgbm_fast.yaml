# 実験名
run_name: lgbm_fast

# ランダムシード
seed: 42

# パス設定
paths:
  input_dir: data
  processed_dir: data/processed
  models_dir: models
  submissions_dir: submissions
  logs_dir: logs

files:
  train: train.csv
  test: test.csv

# 目的変数
target:
  column: market_forward_excess_returns

# 交差検証
cv:
  strategy: time_series
  n_splits: 5
  time_column: date_id

# 特徴量エンジニアリング
features:
  drop_columns:
    - date_id
    - forward_returns
    - risk_free_rate
    - market_forward_excess_returns
    - lagged_forward_returns
    - lagged_risk_free_rate
    - lagged_market_forward_excess_returns
    - is_scored
  imputation_strategy: rolling_ensemble
  imputation_rolling_windows: [5, 20, 60, 240]
  imputation_rolling_weights: [0.4, 0.3, 0.2, 0.1]
  scale: true
  rolling_windows: [5, 20, 60, 240]
  rolling_stats: ["mean", "std", "zscore"]

# Optunaによる探索設定（軽量版）
optuna:
  n_trials: 20
  direction: minimize

# モデル設定
model:
  type: lightgbm
  fit_intercept: false
  params:
    objective: "regression_l1"
    metric: "rmse"
    verbosity: -1
    boosting_type: "gbdt"
    learning_rate: { type: "loguniform", low: 0.02, high: 0.08 }
    num_leaves: { type: "int", low: 31, high: 128 }
    max_depth: { type: "int", low: 4, high: 10 }
    feature_fraction: { type: "uniform", low: 0.7, high: 1.0 }
    bagging_fraction: { type: "uniform", low: 0.7, high: 1.0 }
    bagging_freq: { type: "int", low: 1, high: 7 }
    min_data_in_leaf: { type: "int", low: 20, high: 200 }
    lambda_l1: { type: "loguniform", low: 1e-4, high: 5.0 }
    lambda_l2: { type: "loguniform", low: 1e-4, high: 5.0 }
